<div class="container-fluid d-flex justify-content-center">
  <div style="width: 80%;">
    <div class="row">
      @for (column of columns; track $index) {
        <div class="column">
          @for (image of column; track $index) {
            <img [src]="image?.getPhotoPath" [alt]="image.getName" (click)="openCarousel(image)"/>
          }
        </div>
      }

    </div>
  </div>
</div>

@if(showCarousel()){
<app-carousel [parentComponentName]="'gallery'" (closeCarousel)="showCarousel.set(false)" />
}
