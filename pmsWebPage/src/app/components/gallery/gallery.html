<div class="container-fluid">
  <div style="width: 80%;">
    <div class="row">
      <div class="column">
        <img [src]="galleryService.galleryImages[0]?.getPhotoPath" alt="" />
        <img [src]="galleryService.galleryImages[3]?.getPhotoPath" alt="" />
      </div>
      <div class="column">
        <img [src]="galleryService.galleryImages[1]?.getPhotoPath" alt="" />
        <img [src]="galleryService.galleryImages[4]?.getPhotoPath" alt="" />
      </div>
      <div class="column">
        <img [src]="galleryService.galleryImages[2]?.getPhotoPath" alt="" />
        <img [src]="galleryService.galleryImages[5]?.getPhotoPath" alt="" />
      </div>
    </div>
  </div>
</div>

@if(showCarousel()){
<app-carousel (closeCarousel)="closeCarousel()" />
}
