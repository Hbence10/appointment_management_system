<div class="container-fluid">
  <div class="row px-3 mb-4">
    <div class="col-lg-8 px-4" id="bioContainer">
      <p class="text-lg-start text-md-center text-sm-center text-center">
        <span class="fw-bold mainFont">Cím:</span><br>
        <span class="secondFont">{{details.getAddress}}</span>
      </p>

      <p class="text-lg-start text-md-center text-sm-center text-center">
        <span class="fw-bold mainFont">Elérhetőség</span><br>
        <span class="secondFont">{{details.getPhone}}</span>
      </p>

      <p class="text-lg-start text-md-center text-sm-center text-center">
        <span class="fw-bold mainFont">Email</span><br>
        <span class="secondFont">{{details.getEmail}}</span>
      </p>

      <p class="text-lg-start text-md-center text-sm-center text-center">
        <span class="fw-bold mainFont">Tűz esetén értesitendő</span><br>
        <span class="secondFont">{{details.getFirePhone}}</span>
      </p>

      <p class="text-lg-start text-md-center text-sm-center text-center">
        <span class="fw-bold mainFont">Nyitvatartás</span><br>
        <span class="secondFont">10:00 - 22:00</span>
      </p>
    </div>
    <div class="col-lg-4">
      <!-- Google Maps -->
       <!-- <google-map
          height="400px"
          width="750px"
          [center]="center"
          [zoom]="zoom"
          (mapClick)="moveMap($event)"
          (mapMousemove)="move($event)" />

        <div>Latitude: {{display?.lat}}</div>
        <div>Longitude: {{display?.lng}}</div> -->
    </div>
  </div>

  <div class="row px-3 mt-1 mb-2">
    <div class="col-lg-12 px-4 d-lg-flex justify-content-lg-between align-items-lg-center">
      <p class="secondFont text-lg-start text-md-center text-sm-center text-center">© 2025 — Copyright</p>
      <p class="secondFont text-lg-start text-md-center text-sm-center text-center">Privacy</p>
    </div>
  </div>
</div>
