<div class="container-fluid d-lg-flex justify-content-center align-content-center" style="height: 83vh">
  <div class="row">
    <div class="col-lg-12 d-flex justify-content-center align-items-center">
      <div id="mainContainer" class="container-fluid secondBg strongShadow px-4 pt-5">
        <form [formGroup]="form" class="container-flud d-flex flex-column justify-content-between align-content-center">
          <!-- 1. -->
          <div class="row">
            <div class="col-lg-12">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <h1 class="mainFont">Elfelejtette jelszavát?</h1>
                  <h5 class="secondFont">Jelszó emlékeztető</h5>
                </div>
                <div class="d-flex justify-content-start align-items-center">
                  <a routerLink="/login">
                    <button class="d-flex flex-fill justify-content-center align-items-center iconButton">
                      <span class="material-symbols-outlined">arrow_back</span>
                    </button>
                  </a>
                </div>
              </div>
              <hr />
            </div>
          </div>

          <!-- 2. -->
          <div style="height: 370px">
            <div class="row">
              @if (emailErrorMsg() != ""){
                <mat-error>{{emailErrorMsg()}}</mat-error>
              }
              <div class="col-lg-9 col-md-8 col-sm-8 col-8">

                <mat-form-field class="w-100">
                  <mat-label>Email cím</mat-label>
                  <input type="text" matInput placeholder="Adja meg a fiokjához tartozó email címet" formControlName="email"/>
                </mat-form-field>
              </div>
              <div class="col-lg-3 col-md-4 col-sm-4 col-4 d-flex justify-content-center align-items-start">
                <button class="filledButton" (click)="getCode()" [disabled]="form.controls['email'].invalid" style="height: 56px !important;">Kód küldése</button>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-12">
                @if(vCodeErrorMsg() != ""){
                  <mat-error>{{vCodeErrorMsg()}}</mat-error>
                }
                <mat-form-field class="w-100">
                  <mat-label>Hitelesitő kód</mat-label>
                  <input type="text" matInput placeholder="Hitelesitő kód" formControlName="verificationCode" #vCodeInput (input)="checkVCode(vCodeInput.value)"/>
                </mat-form-field>
              </div>
            </div>

            @if (isCorrectVCode()) {
            <div class="row">
              <div class="col-lg-12">
                <mat-form-field class="w-100">
                  <mat-label>Új jelszó</mat-label>
                  <input matInput [type]="isShowPassword() ? 'text' : 'password'" formControlName="password"/>
                  <button matIconButton matSuffix (click)="showPassword($event)" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="isShowPassword()">
                    <span class="material-symbols-outlined">{{
                      isShowPassword() ? "visibility" : "visibility_lock"
                    }}</span>
                  </button>
                </mat-form-field>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-12">
                <mat-form-field class="w-100">
                  <mat-label>Jelszó újra</mat-label>
                  <input matInput [type]="isShowPasswordAgain() ? 'text' : 'password'" formControlName="passwordAgain"/>
                  <button matIconButton matSuffix (click)="showPasswordAgain($event)" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="isShowPassword()">
                    <span class="material-symbols-outlined">{{
                      isShowPasswordAgain() ? "visibility" : "visibility_lock"
                    }}</span>
                  </button>
                </mat-form-field>
              </div>
            </div>
            }
          </div>

          <!-- 3. -->
          <div class="row">
            <div class="col-lg-12">
              <button class="w-100 filledButton" matButton="filled" [disabled]="form.invalid" (click)="sendReset(vCodeInput.value)">Mentés</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
